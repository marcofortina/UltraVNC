name: Native Linux subset

on:
  workflow_dispatch:
  pull_request:
    branches: [ main, master ]
  push:
    branches: [ main, master ]

permissions:
  contents: read

concurrency:
  group: native-linux-subset-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-linux-ci-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            pkg-config \
            zlib1g-dev \
            libzstd-dev \
            liblzma-dev \
            libjpeg-dev \
            libx11-dev \
            libxext-dev \
            libpipewire-0.3-dev \
            libdbus-1-dev \
            libxtst-dev \
            libxi-dev \
            qt6-base-dev

      - name: Native Linux CI gate smoke
        run: |
          cmake/native-linux-ci-gate-smoke.sh \
            /tmp/uvnc-native-linux-ci-gate-build \
            /tmp/uvnc-native-linux-ci-gate-install
