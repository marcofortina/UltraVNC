name: Native Linux subset

on:
  pull_request:
    branches: [ main, master ]
  push:
    branches: [ main, master ]

jobs:
  native-linux-closure:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            pkg-config \
            zlib1g-dev \
            libzstd-dev \
            liblzma-dev \
            libjpeg-dev \
            libx11-dev \
            libxext-dev \
            libpipewire-0.3-dev \
            libdbus-1-dev \
            libxtst-dev \
            libxi-dev \
            qt6-base-dev

      - name: Repeater Linux closure smoke
        run: |
          cmake/repeater-linux-smoke.sh \
            /tmp/uvnc-repeater-linux-build \
            /tmp/uvnc-linux-closure-install

      - name: WinVNC portable core closure smoke
        run: |
          cmake/winvnc-portable-core-closure.sh \
            /tmp/uvnc-winvnc-portable-core-build \
            /tmp/uvnc-linux-closure-install

      - name: Memory server RFB closure smoke
        run: |
          cmake/memory-server-rfb-closure.sh \
            /tmp/uvnc-memory-server-rfb-build \
            /tmp/uvnc-linux-closure-install

      - name: X11 capture smoke
        run: |
          cmake/x11-capture-smoke.sh \
            /tmp/uvnc-x11-capture-build \
            /tmp/uvnc-linux-closure-install

      - name: PipeWire portal capture smoke
        run: |
          cmake/pipewire-capture-smoke.sh \
            /tmp/uvnc-pipewire-capture-build \
            /tmp/uvnc-linux-closure-install

      - name: Linux input backend smoke
        run: |
          cmake/linux-input-smoke.sh \
            /tmp/uvnc-linux-input-build \
            /tmp/uvnc-linux-closure-install

      - name: Native Linux server integration smoke
        run: |
          cmake/linux-server-integration-smoke.sh \
            /tmp/uvnc-linux-server-integration-build \
            /tmp/uvnc-linux-closure-install

      - name: Native Linux Qt viewer smoke
        run: |
          cmake/qt-viewer-smoke.sh \
            /tmp/uvnc-qt-viewer-build \
            /tmp/uvnc-linux-closure-install

      - name: Native Linux Qt viewer RFB smoke
        run: |
          cmake/qt-viewer-rfb-smoke.sh \
            /tmp/uvnc-qt-viewer-rfb-build \
            /tmp/uvnc-linux-closure-install
